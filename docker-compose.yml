# FlowHub 전체 스택 오케스트레이션
# 실행: docker compose up -d --build

services:
  # ─────────────────────────────────────────────
  # 1. PostgreSQL 16 (메인 DB)
  # ─────────────────────────────────────────────
  flowhub-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowhub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-flowhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowhub} -d ${POSTGRES_DB:-flowhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowhub-net

  # ─────────────────────────────────────────────
  # 2. Redis 7 (세션/캐시/Pub-Sub)
  # ─────────────────────────────────────────────
  flowhub-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowhub-net

  # ─────────────────────────────────────────────
  # 3. Backend: Node.js API + WebSocket (Port 4000)
  # ─────────────────────────────────────────────
  flowhub-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      flowhub-db:
        condition: service_healthy
      flowhub-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowhub}:${POSTGRES_PASSWORD:-flowhub_secret}@flowhub-db:5432/${POSTGRES_DB:-flowhub}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@flowhub-redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SOCKET_PATH: /socket.io
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - flowhub-net

  # ─────────────────────────────────────────────
  # 4. Frontend: Next.js Web App (Port 3000)
  # ─────────────────────────────────────────────
  flowhub-frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    restart: unless-stopped
    depends_on:
      flowhub-backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - flowhub-net

  # ─────────────────────────────────────────────
  # 5. Nginx Reverse Proxy (Port 80/443)
  # ─────────────────────────────────────────────
  flowhub-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      flowhub-frontend:
        condition: service_healthy
      flowhub-backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - flowhub-net

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  flowhub-net:
    driver: bridge
